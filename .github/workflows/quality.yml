name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test,lint]'
      - run: pytest -q
      - run: python -m compileall .
      - run: ruff format --check .
      - run: ruff check .
      - run: git diff --check
