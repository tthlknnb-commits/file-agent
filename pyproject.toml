[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-admin-office-file-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
lint = ["ruff>=0.6,<1"]

[project.scripts]
ai-admin-local-agent = "local_agent:main"
ai-admin-local-bridge = "local_bridge:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
